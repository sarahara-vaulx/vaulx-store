<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULX Shop — On-Hand Items</title>
  <style>
    :root { --black:#0a0a0a; --gold:#c9a96e; --gold2:#e8c97a; --white:#fff; --gray:#111; --gray2:#1a1a1a; }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--black); color:var(--white); font-family:Georgia,serif; }

    /* NAV */
    header { position:sticky; top:0; z-index:200; background:var(--black); border-bottom:1px solid var(--gold); padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; }
    .logo { color:var(--gold); text-decoration:none; font-size:1.4rem; letter-spacing:.25em; font-weight:bold; }
    .nav a { color:rgba(255,255,255,.65); text-decoration:none; margin-left:1.5rem; font-size:.85rem; letter-spacing:.1em; transition:color .2s; }
    .nav a:hover,.nav a.here { color:var(--gold); }

    /* HERO */
    .hero { padding:3rem 2rem 2.5rem; text-align:center; border-bottom:1px solid rgba(201,169,110,.12); }
    .hero h1 { color:var(--gold); font-size:2.2rem; letter-spacing:.35em; margin-bottom:.5rem; }
    .hero p  { color:rgba(255,255,255,.45); font-size:.88rem; letter-spacing:.06em; }

    /* GRID */
    main { max-width:1200px; margin:0 auto; padding:3rem 1.5rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(265px,1fr)); gap:1.5rem; }

    /* CARD */
    .card { background:var(--gray); border:1px solid rgba(201,169,110,.14); border-radius:3px; overflow:hidden; transition:border-color .25s,transform .25s; }
    .card:hover { border-color:rgba(201,169,110,.55); transform:translateY(-3px); }
    .card-img { width:100%; height:200px; object-fit:cover; display:block; }
    .card-ph  { width:100%; height:200px; background:linear-gradient(135deg,#161616,#222); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; }
    .card-ph .pi { font-size:2.5rem; }
    .card-ph .pl { color:rgba(255,255,255,.18); font-size:.65rem; letter-spacing:.12em; }
    .card-body { padding:1.2rem; }
    .badge { display:inline-block; font-size:.67rem; letter-spacing:.08em; padding:.2rem .55rem; border-radius:20px; margin-bottom:.7rem; }
    .b-low { background:rgba(255,80,80,.1); color:#ff8080; border:1px solid rgba(255,80,80,.2); }
    .b-ok  { background:rgba(80,200,110,.1); color:#60d880; border:1px solid rgba(80,200,110,.2); }
    .card-name  { font-size:.87rem; line-height:1.45; margin-bottom:.9rem; min-height:2.5rem; }
    .card-price { font-size:1.3rem; color:var(--gold); font-weight:bold; }
    .tag-disc   { font-size:.66rem; letter-spacing:.08em; background:rgba(201,169,110,.1); border:1px solid rgba(201,169,110,.2); color:var(--gold); padding:.14rem .4rem; border-radius:2px; margin-left:.4rem; vertical-align:middle; }
    .btn-buy    { display:block; width:100%; margin-top:1rem; padding:.75rem; background:var(--gold); color:var(--black); border:none; font-size:.8rem; letter-spacing:.2em; font-weight:bold; cursor:pointer; transition:background .2s; border-radius:1px; }
    .btn-buy:hover { background:var(--gold2); }
    .btn-buy:disabled { opacity:.35; cursor:not-allowed; }

    /* MODAL */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:300; align-items:center; justify-content:center; padding:1rem; }
    .overlay.open { display:flex; }
    .modal { background:var(--gray); border:1px solid var(--gold); border-radius:3px; width:100%; max-width:390px; padding:2rem; }
    .mo-title { color:var(--gold); font-size:.92rem; letter-spacing:.25em; margin-bottom:.35rem; }
    .mo-sub   { font-size:.78rem; color:rgba(255,255,255,.42); line-height:1.4; margin-bottom:1.4rem; }
    .field { margin-bottom:.9rem; }
    .field label { display:block; font-size:.68rem; letter-spacing:.12em; color:var(--gold); margin-bottom:.28rem; }
    .field input,.field select { width:100%; padding:.62rem .75rem; background:#0a0a0a; border:1px solid rgba(201,169,110,.22); color:var(--white); font-size:.87rem; border-radius:2px; transition:border-color .2s; }
    .field input:focus,.field select:focus { outline:none; border-color:var(--gold); }
    .total-box { background:rgba(201,169,110,.06); border:1px solid rgba(201,169,110,.16); border-radius:2px; padding:.75rem 1rem; margin:.9rem 0 1.2rem; display:flex; justify-content:space-between; align-items:center; }
    .total-label  { font-size:.72rem; letter-spacing:.1em; color:rgba(255,255,255,.45); }
    .total-amount { font-size:1.25rem; color:var(--gold); font-weight:bold; }
    .mo-btns { display:flex; gap:.75rem; }
    .btn-cancel2 { flex:1; padding:.72rem; background:transparent; border:1px solid rgba(255,255,255,.14); color:rgba(255,255,255,.5); cursor:pointer; font-size:.78rem; border-radius:1px; transition:border-color .2s; }
    .btn-cancel2:hover { border-color:rgba(255,255,255,.3); }
    .btn-pay2 { flex:2; padding:.72rem; background:var(--gold); color:var(--black); border:none; font-weight:bold; font-size:.82rem; letter-spacing:.1em; cursor:pointer; border-radius:1px; transition:background .2s; }
    .btn-pay2:hover { background:var(--gold2); }
    .btn-pay2:disabled { opacity:.4; cursor:not-allowed; }
    .mo-loading { text-align:center; font-size:.78rem; color:rgba(255,255,255,.45); margin-top:.75rem; display:none; }

    footer { text-align:center; padding:2rem; border-top:1px solid rgba(201,169,110,.1); color:rgba(255,255,255,.2); font-size:.73rem; letter-spacing:.05em; margin-top:3rem; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">VAULX</a>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/shop.html" class="here">Shop</a>
  </nav>
</header>

<div class="hero">
  <h1>VAULX SHOP</h1>
  <p>On-hand items · Ready to ship · 25% off retail</p>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mo-title">CHECKOUT</div>
    <div class="mo-sub" id="mo-name">Loading…</div>
    <div class="field"><label>FULL NAME</label><input id="f-name" type="text" placeholder="Your full name" autocomplete="name"></div>
    <div class="field"><label>EMAIL</label><input id="f-email" type="email" placeholder="you@email.com" autocomplete="email"></div>
    <div class="field"><label>MOBILE / WHATSAPP</label><input id="f-phone" type="tel" placeholder="+63 9XX XXX XXXX" autocomplete="tel"></div>
    <div class="field"><label>QUANTITY</label><select id="f-qty"></select></div>
    <div class="total-box">
      <span class="total-label">ORDER TOTAL</span>
      <span class="total-amount" id="total-show">$0.00</span>
    </div>
    <div class="mo-btns">
      <button class="btn-cancel2" id="btn-close">CANCEL</button>
      <button class="btn-pay2"    id="btn-pay">PAY NOW →</button>
    </div>
    <div class="mo-loading" id="mo-loading">Connecting to secure payment…</div>
  </div>
</div>

<footer>© 2025 VAULX Store · The finest things, delivered to you.</footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PRODUCTS — to add images, pick ONE option per product:

   Option A – Google Drive (must be set to "Anyone with the link"):
     1. Open the file in Drive → Share → "Anyone with the link"
     2. Copy the file ID from: drive.google.com/file/d/[FILE_ID_HERE]/view
     3. Set img: "https://drive.google.com/uc?export=view&id=FILE_ID_HERE"

   Option B – GitHub upload (more reliable, recommended):
     1. In your GitHub repo, Add file → Upload files → upload to /images/ folder
     2. Set img: "/images/your-filename.jpg"

   Leave img:"" to keep the emoji placeholder.
═══════════════════════════════════════════════════════════════════════ */
const PRODUCTS = [
  { id:1, name:"One Love Beauty Vitamin B Enzyme Cleansing Oil + Makeup Remover 4oz", price:27.30, stock:10, img:"", icon:"🧴" },
  { id:2, name:"Gen See Mixed Media Matte Liquid Eyeshadow – Rose Water",              price:21.23, stock:10, img:"", icon:"💄" },
  { id:3, name:"Keratin Restorative Hair Mask 500ml / 16.9 fl.oz",                    price:23.25, stock:19, img:"", icon:"💆" },
  { id:4, name:"Typology Tinted Serum with Vitamin C, Squalane & Aloe Vera",          price:35.55, stock:8,  img:"", icon:"✨" },
  { id:5, name:'Mussel Bound Adhesive Tile Mat Mini Roll 3"×15"',                     price:14.53, stock:14, img:"", icon:"🏠" },
  { id:6, name:"Prince of Peace Organic White Tea 20 bags",                           price:3.38,  stock:38, img:"", icon:"🍵" },
  { id:7, name:"ENHYPEN ROMANCE: UNTOLD 2nd Full Album Standard 3 Ver Set",           price:21.37, stock:4,  img:"", icon:"💿" },
  { id:8, name:"Cirkul 12oz Plastic Water Bottle Starter Kit",                        price:16.86, stock:50, img:"", icon:"💧" },
  { id:9, name:"Typology Serum Mascara with 1% Pea Peptides + Castor Oil",            price:23.10, stock:5,  img:"", icon:"👁️" }
];

let active = null;

function render() {
  document.getElementById('grid').innerHTML = PRODUCTS.map(p => {
    const badge = p.stock <= 5
      ? `<span class="badge b-low">⚠ Only ${p.stock} left</span>`
      : `<span class="badge b-ok">✓ In stock (${p.stock})</span>`;
    const img = p.img
      ? `<img class="card-img" src="${p.img}" alt="${p.name}" loading="lazy">`
      : `<div class="card-ph"><div class="pi">${p.icon}</div><div class="pl">IMAGE COMING SOON</div></div>`;
    return `
      <div class="card">
        ${img}
        <div class="card-body">
          ${badge}
          <div class="card-name">${p.name}</div>
          <div class="card-price">$${p.price.toFixed(2)}<span class="tag-disc">25% OFF</span></div>
          <button class="btn-buy" onclick="openModal(${p.id})">BUY NOW</button>
        </div>
      </div>`;
  }).join('');
}

function openModal(id) {
  active = PRODUCTS.find(p => p.id === id);
  if (!active) return;
  document.getElementById('mo-name').textContent = active.name;
  const sel = document.getElementById('f-qty');
  const max = Math.min(active.stock, 10);
  sel.innerHTML = Array.from({length:max}, (_,i) => `<option value="${i+1}">${i+1}</option>`).join('');
  refreshTotal();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('mo-loading').style.display = 'none';
  document.getElementById('btn-pay').disabled = false;
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  active = null;
}

function refreshTotal() {
  if (!active) return;
  const qty = +document.getElementById('f-qty').value || 1;
  document.getElementById('total-show').textContent = `$${(active.price * qty).toFixed(2)}`;
}

document.getElementById('f-qty').addEventListener('change', refreshTotal);
document.getElementById('btn-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeModal(); });

document.getElementById('btn-pay').addEventListener('click', async () => {
  const name  = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const qty   = parseInt(document.getElementById('f-qty').value, 10);

  if (!name || !email || !phone) { alert('Please fill in all required fields.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Please enter a valid email address.'); return; }

  const btn = document.getElementById('btn-pay');
  const msg = document.getElementById('mo-loading');
  btn.disabled = true;
  msg.style.display = 'block';

  const orderId = `VAULX-${Date.now()}`;
  const amount  = (active.price * qty).toFixed(2);

  try {
    const res = await fetch('/api/fiuu-checkout', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        orderId,
        amount,
        billName:  name,
        billEmail: email,
        billPhone: phone,
        billDesc:  `${active.name} x${qty}`,
        currency:  'USD'
      })
    });
    if (!res.ok) throw new Error('Server error ' + res.status);

    const { paymentUrl, formData } = await res.json();

    // Build and auto-submit form to Fiuu payment page
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = paymentUrl;
    form.style.display = 'none';
    Object.entries(formData).forEach(([k, v]) => {
      const inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = k; inp.value = v;
      form.appendChild(inp);
    });
    document.body.appendChild(form);
    form.submit();

  } catch(err) {
    console.error(err);
    alert('Payment setup failed. Please try again.');
    btn.disabled = false;
    msg.style.display = 'none';
  }
});

render();
</script>
</body>
</html>
